
<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0" />
    <title>Velvet Hearts | Premium Inclusive Relationship Platform</title>

    <!-- SEO Meta Tags -->
    <meta name="description" content="Velvet Hearts is a high-intent relationship platform featuring 2-minute voice intros, inclusive accessibility options, real-time vibe matching, and meaningful connections." />
    <meta name="keywords" content="dating app, high intent relationship, voice intro dating, inclusive dating, serious relationships, velvet hearts, dating platform" />
    <meta name="author" content="Velvet Hearts Team" />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://velvethearts.app/" />
    <meta name="theme-color" content="#b8436a" />

    <!-- Performance & Image Preloading -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preload" as="image" href="/velvet-heart-logo.png" type="image/png" fetchpriority="high" />
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=Playfair+Display:ital,wght@0,600;0,700;1,600&display=swap" rel="stylesheet" />

    <!-- Velvet Hearts Favicon & Manifest -->
    <link rel="icon" type="image/png" href="/velvet-heart-logo.png" />
    <link rel="apple-touch-icon" href="/velvet-heart-logo.png" />
    <link rel="manifest" href="/manifest.json" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://velvethearts.app/" />
    <meta property="og:site_name" content="Velvet Hearts" />
    <meta property="og:title" content="Velvet Hearts | Premium Inclusive Relationship Platform" />
    <meta property="og:description" content="Connect authentically with voice intros, real-time vibe matching, and deep relationship intent." />
    <meta property="og:image" content="https://velvethearts.app/logo.jpeg" />

    <!-- Twitter Cards -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:url" content="https://velvethearts.app/" />
    <meta name="twitter:title" content="Velvet Hearts | Premium Inclusive Relationship Platform" />
    <meta name="twitter:description" content="Connect authentically with voice intros, real-time vibe matching, and deep relationship intent." />
    <meta name="twitter:image" content="https://velvethearts.app/logo.jpeg" />

    <!-- Structured Data Schema (JSON-LD) -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "Velvet Hearts",
        "url": "https://velvethearts.app/",
        "applicationCategory": "LifestyleApplication",
        "operatingSystem": "All",
        "description": "Inclusive, high-intent relationship platform with voice notes, accessibility options, and real-time connections.",
        "offers": {
          "@type": "Offer",
          "price": "0",
          "priceCurrency": "USD"
        }
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js')
            .then((reg) => console.log('✅ Velvet Hearts Service Worker registered:', reg.scope))
            .catch((err) => console.warn('❌ Service Worker registration failed:', err));
        });
      }
    </script>
  </body>
</html>
